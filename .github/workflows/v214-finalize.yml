name: V214 finalize

on:
  push:
    branches:
      - chatgpt/v214-visit-reopen-guard
    paths:
      - .github/workflows/v214-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v214-visit-reopen-guard
      - name: Publier le build V214
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          old='20260918-perfdrag213'
          new='20260918-visitresume214'
          for filename in ['index.html','sw.js']:
              p=Path(filename)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'{old} absent de {filename}')
              p.write_text(text.replace(old,new))
          Path('version.json').write_text(json.dumps({
              'latestBuild':new,
              'displayVersion':'214',
              'channel':'stable',
              'releasedAt':'2026-09-18'
          },ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "REDNEWT69"
          git config user.email "103671138+REDNEWT69@users.noreply.github.com"
          git add index.html sw.js version.json
          git commit -m "V214 : publier 20260918-visitresume214"
          git push
