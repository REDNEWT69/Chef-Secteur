name: V220 coverage patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v220-pilotage-snail-reliability
      - run: python .github/v220_coverage_patch.py
      - run: node --check v182-fixes.js && node tests/v182-field-fixes.test.cjs && node tests/terrain-planning-v1.test.cjs && git diff --check
      - run: |
          git config user.name REDNEWT69
          git config user.email 103671138+REDNEWT69@users.noreply.github.com
          git add -A
          git commit -m "Fix V220 preserve workday coverage after geography"
          git push origin HEAD:chatgpt/v220-pilotage-snail-reliability
