name: V207 visual marker patch
"on":
  push:
    branches:
      - chatgpt/v207-future-overnight-cue
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v207-future-overnight-cue
      - name: Appliquer le correctif visuel
        run: python3 scripts/v207_visual_marker_patch.py
      - name: Vérifier syntaxe et garde slider
        run: |
          node tests/syntax.test.cjs
          node tests/period-day-slider.test.cjs
      - name: Commit du correctif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add period-day-slider.js tests/overnight-day-badge-browser.spec.cjs
          git commit -m "V207 : rendre la lune future résistante aux rerenders"
          git push origin HEAD:chatgpt/v207-future-overnight-cue
