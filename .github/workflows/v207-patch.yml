name: V207 patch
"on":
  push:
    branches:
      - chatgpt/v207-future-overnight-cue
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v207-future-overnight-cue
      - name: Appliquer V207
        run: python3 scripts/v207_patch.py
      - name: Vérifier le slider
        run: |
          node tests/syntax.test.cjs
          node tests/period-day-slider.test.cjs
      - name: Commit V207
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V207 : signaler les découchés des semaines futures"
          git push origin HEAD:chatgpt/v207-future-overnight-cue
