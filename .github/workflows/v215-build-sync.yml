name: V215 build sync

on:
  push:
    branches:
      - chatgpt/v215-visit-mobile-ux
    paths:
      - .github/workflows/v215-build-sync.yml

permissions:
  contents: write

jobs:
  sync-runtime-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v215-visit-mobile-ux
      - name: Synchroniser index.html sur le build V215
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '20260918-visitresume214'
          new = '20260918-visitux215'
          count = text.count(old)
          if count == 0:
              raise SystemExit('Aucune révision V214 trouvée dans index.html')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print(f'{count} occurrence(s) synchronisée(s) vers {new}')
          PY
      - name: Commit index synchronisé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'chore(v215): synchroniser le build runtime'
          git push origin HEAD:chatgpt/v215-visit-mobile-ux
