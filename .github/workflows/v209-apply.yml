name: V209 apply patch
on:
  push:
    branches: [chatgpt/v209-performance-store-reconcile]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Appliquer V209
        run: python3 .github/scripts/apply-v209.py
      - name: Gardes ciblés V209
        run: |
          node tests/syntax.test.cjs
          node tests/performance-v190.test.cjs
          node tests/performance-store-reconcile-v209.test.cjs
          node tests/nominatim-compliance.test.cjs
          node tests/region-stores.test.cjs
          node tests/terrain-planning-runtime.test.cjs
          node tests/v182-field-fixes.test.cjs
      - name: Committer le produit V209
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add performance-ui-v190.js profile-controller.js tests/performance-store-reconcile-v209.test.cjs tests/performance-store-reconcile-v209-browser.spec.cjs .github/workflows/reliability-checks.yml index.html sw.js version.json tests/terrain-planning-runtime.test.cjs tests/v182-field-fixes.test.cjs
          git diff --cached --quiet && exit 1
          git commit -m 'V209 : réconcilier les magasins performance avec le secteur'
          git push origin HEAD:chatgpt/v209-performance-store-reconcile
