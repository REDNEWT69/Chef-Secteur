name: V223 patch

on:
  push:
    branches:
      - chatgpt/v223-proofreader-rate-limit
    paths:
      - .github/workflows/v223-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v223-proofreader-rate-limit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V223 patch
        run: python3 tools/v223_patch.py
      - name: Focused checks
        run: |
          node tests/syntax.test.cjs
          node tests/note-proofreader-v221.test.cjs
          node tests/build-revision.test.cjs
          node tests/branding.test.cjs
      - name: Commit V223
        run: |
          rm -f tools/v223_patch.py .github/workflows/v223-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V223: handle proofreader rate limits safely'
          git push origin HEAD:chatgpt/v223-proofreader-rate-limit
