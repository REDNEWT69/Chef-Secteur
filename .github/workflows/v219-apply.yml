name: V219 apply once
on:
  push:
    branches: [chatgpt/v219-planning-summary]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v219-planning-summary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Appliquer la release V219
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          old='20260918-moononly218'
          new='20260918-planningsummary219'

          p=Path('index.html'); text=p.read_text()
          if old not in text and new not in text: raise SystemExit('BUILD_REV attendu absent de index.html')
          text=text.replace(old,new)
          anchor="'./sector-pilotage.js','./v182-fixes.js'"
          replacement="'./sector-pilotage.js','./planning-summary-v219.js','./v182-fixes.js'"
          if './planning-summary-v219.js' not in text:
              if anchor not in text: raise SystemExit('point insertion V219 absent de index.html')
              text=text.replace(anchor,replacement,1)
          p.write_text(text)

          p=Path('sw.js'); text=p.read_text()
          if old not in text and new not in text: raise SystemExit('BUILD_REV attendu absent de sw.js')
          text=text.replace(old,new)
          anchor='  "./planning-pro-plus.js",\n'
          if '"./planning-summary-v219.js"' not in text:
              if anchor not in text: raise SystemExit('point insertion V219 absent de sw.js')
              text=text.replace(anchor,anchor+'  "./planning-summary-v219.js",\n',1)
          p.write_text(text)

          p=Path('version.json'); data=json.loads(p.read_text())
          data.update(latestBuild=new,displayVersion='219',channel='stable',releasedAt='2026-09-18')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          node -c planning-summary-v219.js
          node tests/planning-summary-v219.test.cjs
          git diff --check
      - name: Commit release V219
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js version.json
          git commit -m 'V219 : publier la synthèse planning'
          git push origin HEAD:chatgpt/v219-planning-summary
