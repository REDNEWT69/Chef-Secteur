name: V213 finalize

on:
  push:
    branches:
      - chatgpt/v213-performance-drag-sheet
    paths:
      - .github/workflows/v213-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v213-performance-drag-sheet
      - name: Bump V213 and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          old='20260918-schedulehotel212'
          new='20260918-perfdrag213'
          for name in ('index.html','sw.js'):
              p=Path(name)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'{old} absent de {name}')
              p.write_text(s.replace(old,new))
          p=Path('version.json')
          data=json.loads(p.read_text())
          data.update(latestBuild=new,displayVersion='213',channel='stable',releasedAt='2026-09-18')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v213-finalize.yml
          git add index.html sw.js version.json
          git commit -m "V213 : publier perfdrag213"
          git push origin HEAD:chatgpt/v213-performance-drag-sheet
