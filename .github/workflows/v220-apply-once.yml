name: V220 apply once
on:
  push:
    branches:
      - chatgpt/v220-pilotage-snail-reliability
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v220-pilotage-snail-reliability
      - name: Appliquer et valider V220
        run: |
          python tools/v220_patch.py
          rm tools/v220_patch.py .github/workflows/v220-apply-once.yml
          node -c sector-pilotage.js
          node -c terrain-planning-v1.js
          node tests/sector-pilotage.test.cjs
          node tests/terrain-planning-v1.test.cjs
          node tests/terrain-planning-runtime.test.cjs
          node tests/v182-field-fixes.test.cjs
          node tests/build-revision.test.cjs
          node tests/syntax.test.cjs
          git diff --check
      - name: Commit V220
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V220 : unifier priorités et fiabiliser escargot'
          git push origin HEAD:chatgpt/v220-pilotage-snail-reliability
