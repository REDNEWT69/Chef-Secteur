name: V215 wire runtime
on:
  push:
    branches: [chatgpt/v215-visit-mobile-ux]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'V215 wire complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v215-visit-mobile-ux
      - name: Câbler V215 dans le runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="'./assistant-performance-context-v192.js','./update-manager.js'"
          new="'./assistant-performance-context-v192.js','./visit-mobile-ux-v215.js','./update-manager.js'"
          if old not in s and new not in s:
              raise SystemExit('ancre runtime V215 introuvable')
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit runtime
        run: |
          git config user.name "Store Runner Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "V215 wire complete : charger l'UX visite"
          git push origin HEAD:chatgpt/v215-visit-mobile-ux
