name: V220 mobile test patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v220-pilotage-snail-reliability
      - run: python .github/v220_test_patch.py
      - run: node --check tests/terrain-planning-browser.spec.cjs && git diff --check
      - run: |
          git config user.name REDNEWT69
          git config user.email 103671138+REDNEWT69@users.noreply.github.com
          git add -A
          git commit -m "Fix V220 mobile start-here guard for balanced weeks"
          git push origin HEAD:chatgpt/v220-pilotage-snail-reliability
