name: Mobile zoom reproduction
on:
  push:
    branches: [chatgpt/mobile-focus-zoom-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Reproduire le prérequis auto-zoom à 390 px
        run: node tools/run-browser-tests.mjs tests/mobile-focus-zoom-browser.spec.cjs
