name: V216 wire

on:
  push:
    branches:
      - chatgpt/v216-visit-tabs
    paths:
      - .github/workflows/v216-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v216-visit-tabs
      - name: Brancher V216 dans index.html et sw.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = "'./visit-mobile-ux-v215.js','./update-manager.js'"
          new = "'./visit-mobile-ux-v215.js','./visit-mobile-tabs-v216.js','./update-manager.js'"
          if old not in text and new not in text:
              raise SystemExit('Point de câblage V215 introuvable dans index.html')
          if new not in text:
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          old = '"./performance-data-v190.js", "./performance-ui-v190.js", "./assistant-performance-context-v192.js", "./visit-mobile-ux-v215.js", "./cuisiniste-contracts-v193.js",'
          new = '"./performance-data-v190.js", "./performance-ui-v190.js", "./assistant-performance-context-v192.js", "./visit-mobile-ux-v215.js", "./visit-mobile-tabs-v216.js", "./cuisiniste-contracts-v193.js",'
          if old not in text and new not in text:
              raise SystemExit('Point de cache V215 introuvable dans sw.js')
          if new not in text:
              text = text.replace(old, new, 1)
          sw.write_text(text, encoding='utf-8')
          PY
      - name: Commit du câblage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'V216 : câbler les onglets visite dans le runtime'
          git push origin HEAD:chatgpt/v216-visit-tabs
