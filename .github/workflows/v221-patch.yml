name: V221 branch patch
on:
  push:
    branches: [chatgpt/v221-note-proofreader]
    paths:
      - 'tools/v221_patch.py'
      - '.github/workflows/v221-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v221-note-proofreader
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Appliquer V221
        run: python tools/v221_patch.py
      - name: Tester le correcteur pur
        run: node tests/note-proofreader-v221.test.cjs
      - name: Vérifier syntaxe
        run: node tests/syntax.test.cjs
      - name: Nettoyer et pousser le résultat final
        run: |
          rm -f tools/v221_patch.py .github/workflows/v221-patch.yml
          git config user.name "REDNEWT69"
          git config user.email "103671138+REDNEWT69@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à pousser"
            exit 0
          fi
          git commit -m "V221: correcteur intelligent des notes terrain"
          git push origin HEAD:chatgpt/v221-note-proofreader
