name: Android TWA build

# Compile l'enveloppe Android (android/) : APK debug + AAB release NON signé.
# Aucun secret, aucune signature de publication, aucune écriture Git, aucun envoi Play.
# La signature et l'upload restent une étape manuelle documentée dans android/README.md.
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-twa-build.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-twa-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + bundleRelease (non signé)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Vérifier le wrapper Gradle
        uses: gradle/actions/wrapper-validation@v6
      - name: Installer la plateforme Android 36
        run: |
          test -n "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Construire l'APK debug et l'AAB release
        run: ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease
      - name: Contrôler l'identité de l'APK
        run: |
          set -eu
          apk=app/build/outputs/apk/debug/app-debug.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")"
          echo "$badging" | head -n 12
          echo "$badging" | grep -q "^package: name='fr.storerunner.app'"
          echo "$badging" | grep -q "^targetSdkVersion:'36'"
          echo "$badging" | grep -q "^launchable-activity: name='fr.storerunner.app.LauncherActivity'"
          if echo "$badging" | grep -q "^uses-permission:"; then
            echo "$badging" | grep "^uses-permission:"
          fi
          ls -l "$apk" "$aab"
      - name: Conserver l'APK debug (test sur appareil)
        uses: actions/upload-artifact@v7
        with:
          name: store-runner-twa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
