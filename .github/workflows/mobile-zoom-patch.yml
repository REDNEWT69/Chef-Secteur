name: Apply mobile zoom fix
on:
  push:
    branches: [chatgpt/mobile-focus-zoom-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/mobile-focus-zoom-fix
          fetch-depth: 0
      - name: Chaîner le test zoom dans la suite mobile existante
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/mobile-browser.spec.cjs')
          text = path.read_text()
          marker = "require('./mobile-focus-zoom-browser.spec.cjs');"
          if marker not in text:
              needle = "const { test, expect } = require('@playwright/test');\n"
              if needle not in text:
                  raise SystemExit('entête Playwright introuvable')
              text = text.replace(needle, needle + marker + '\n', 1)
              path.write_text(text)
          PY
      - name: Committer le chaînage du test
        run: |
          git config user.name "REDNEWT69"
          git config user.email "103671138+REDNEWT69@users.noreply.github.com"
          git add tests/mobile-browser.spec.cjs
          git diff --cached --check
          git commit -m "test: couvrir le zoom dans la suite mobile"
          git push origin HEAD:chatgpt/mobile-focus-zoom-fix
