name: V224 branding patch
on:
  push:
    branches:
      - chatgpt/v224-proofread-quota
    paths:
      - tools/v224_brand_patch.py
      - .github/workflows/v224-brand-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v224-proofread-quota
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply branding patch
        run: python tools/v224_brand_patch.py
      - name: Focused checks
        run: |
          node tests/note-proofreader-v221.test.cjs
          node tests/branding-relics.test.cjs
          node tests/branding.test.cjs
          node tests/ai-gateway-cors.test.cjs
          node tests/build-revision.test.cjs
      - name: Commit patch
        run: |
          git config user.name "REDNEWT69"
          git config user.email "103671138+REDNEWT69@users.noreply.github.com"
          git add -A
          git commit -m "V224: rendre le prompt correcteur compatible branding [skip ci]"
          git push origin HEAD:chatgpt/v224-proofread-quota
