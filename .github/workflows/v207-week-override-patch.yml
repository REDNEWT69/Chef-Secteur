name: V207 week override patch
"on":
  push:
    branches:
      - chatgpt/v207-future-overnight-cue
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v207-future-overnight-cue
      - name: Appliquer le correctif
        run: python3 scripts/v207_week_override_patch.py
      - name: Vérifier syntaxe et gardes
        run: |
          node tests/syntax.test.cjs
          node tests/period-day-slider.test.cjs
          node tests/overnight-intent-ui.test.cjs
      - name: Commit du correctif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-planning-fix.js period-day-slider.js
          git commit -m "V207 : analyser les archives avec leur vraie semaine"
          git push origin HEAD:chatgpt/v207-future-overnight-cue
