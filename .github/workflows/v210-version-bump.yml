name: V210 version bump
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/v210-route-quality-benchmark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Publier le numéro V210 sur la branche
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          old='20260917-storereconcile209'
          new='20260917-routequality210'

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Ancien BUILD_REV absent de index.html')
          index.write_text(text.replace(old,new),encoding='utf-8')

          sw=Path('sw.js')
          text=sw.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('Ancien BUILD_REV absent de sw.js')
          sw.write_text(text.replace(old,new),encoding='utf-8')

          version=Path('version.json')
          data=json.loads(version.read_text(encoding='utf-8'))
          data.update(latestBuild=new,displayVersion='210',channel='stable',releasedAt='2026-09-17')
          version.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          Path('.github/workflows/v210-version-bump.yml').unlink()
          PY
          git config user.name "REDNEWT69"
          git config user.email "103671138+REDNEWT69@users.noreply.github.com"
          git add index.html sw.js version.json .github/workflows/v210-version-bump.yml
          git commit -m "V210 : publier le build routequality210"
          git push origin "HEAD:${HEAD_REF}"
