name: Apply manual week protection
on:
  push:
    branches: [fix/range-rotation-coverage]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'apply manual week protection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/range-rotation-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/apply-manual-week-protection.cjs
      - run: node tests/planning-manual-week-protection.test.cjs
      - name: Commit production file
        run: |
          if git diff --quiet -- range-planner-v2.js; then
            echo "range-planner-v2.js already contains manual week protection"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add range-planner-v2.js
          git commit -m "apply manual week protection"
          git push origin HEAD:fix/range-rotation-coverage
