name: Deploy Store Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/reliability-checks.yml
  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers statiques
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier Store Runner
        id: deployment
        uses: actions/deploy-pages@v4
