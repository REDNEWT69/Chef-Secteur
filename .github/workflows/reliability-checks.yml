      - run: node v2/tests/storage.test.mjs
      - run: node v2/tests/json-transfer.test.mjs
      - run: node v2/tests/v1-migration.test.mjs
      - run: node v2/tests/navigation.test.mjs
      - run: node v2/tests/shell.test.mjs
      - run: node v2/tests/architecture.test.mjs
      - run: node v2/tests/isolation.test.mjs
      - run: python tests/official_catalog_test.py

  mobile-browser:
    name: mobile browser 390px
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Démarrer Store Runner localement
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/store-runner-http.log 2>&1 &
          echo $! >/tmp/store-runner-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/store-runner-http.log
          exit 1
      - name: Tester V1 et V2 dans un vrai navigateur mobile
        env:
          STORE_RUNNER_E2E_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/mobile-browser.spec.cjs tests/stores-reach-browser.spec.cjs tests/terrain-planning-browser.spec.cjs tests/opening-hours-browser.spec.cjs tests/store-history-browser.spec.cjs tests/store-photos-browser.spec.cjs v2/tests/mobile-browser.spec.cjs v2/tests/planning-browser.spec.cjs v2/tests/planning-range-browser.spec.cjs v2/tests/terrain-tools-browser.spec.cjs v2/tests/v1-import-browser.spec.cjs --workers=1 --reporter=line
      - name: Conserver traces et captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
