name: Reliability checks
on:
  push:
    branches: [main, fix/reliability-backup-calendar]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/syntax.test.cjs
      - run: node tests/backups.test.cjs
      - run: node tests/visit-workflow.test.cjs
      - run: node tests/visit-storage.test.cjs
      - run: node tests/assistant-visit-context.test.cjs
      - run: node tests/calendar.test.cjs
      - run: node tests/google-oauth-production.test.cjs
      - run: node tests/planning.test.cjs
      - run: node tests/period-day-slider.test.cjs
      - run: node tests/planning-period-date.test.cjs
      - run: node tests/mobile-compatibility.test.cjs
      - run: node tests/build-revision.test.cjs
      - run: node tests/visit-counting.test.cjs
      - run: node tests/visit-credits-planning.test.cjs
      - run: node tests/region-stores.test.cjs
      - run: node tests/architecture.test.cjs
      - run: node tests/navigation-architecture.test.cjs
      - run: node tests/calendar-ownership.test.cjs
      - run: node tests/assistant-architecture.test.cjs
      - run: node tests/business-v2-architecture.test.cjs
      - run: node tests/runtime-ownership.test.cjs
      - run: node tests/planning-visual-ownership.test.cjs
      - run: node tests/timeline-architecture.test.cjs
      - run: node tests/working-hours-architecture.test.cjs
      - run: node tests/daily-capacity-architecture.test.cjs
      - run: node tests/ci-policy.test.cjs
      - run: node tests/nominatim-compliance.test.cjs
      - run: node tests/branding.test.cjs
      - run: node tests/titlesub-ownership.test.cjs
      - run: node tests/branding-relics.test.cjs
      - run: node tests/runtime-branding-source.test.cjs
      - run: node tests/planning-picker-stability.test.cjs
      - run: node v2/tests/state.test.mjs
      - run: node v2/tests/store.test.mjs
      - run: node v2/tests/storage.test.mjs
      - run: node v2/tests/json-transfer.test.mjs
      - run: node v2/tests/navigation.test.mjs
      - run: node v2/tests/shell.test.mjs
      - run: node v2/tests/architecture.test.mjs
      - run: node v2/tests/isolation.test.mjs
      - run: python tests/official_catalog_test.py
