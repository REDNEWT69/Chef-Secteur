name: Mise à jour annuaires officiels

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'
  push:
    branches: [main]
    paths:
      - tools/update_official_stores.py
      - tools/official_directory_parsers.py
      - .github/workflows/update-official-stores.yml

permissions:
  contents: read

concurrency:
  group: official-stores-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install requests beautifulsoup4
      - name: Vérifier les parseurs officiels
        run: python tests/official_catalog_test.py
      - name: Collecter les annuaires officiels
        run: python tools/update_official_stores.py
      - name: Détecter un nouveau snapshot
        id: snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/official-stores.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement dans le catalogue officiel." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "## Mise à jour du catalogue disponible" >> "$GITHUB_STEP_SUMMARY"
            echo "Un nouveau \`data/official-stores.json\` a été généré." >> "$GITHUB_STEP_SUMMARY"
            echo "Il est publié comme artefact de ce run et doit être repris via une branche/PR normale avant toute fusion dans \`main\`." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publier le snapshot candidat
        if: steps.snapshot.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: official-stores-candidate-${{ github.run_id }}
          path: data/official-stores.json
          if-no-files-found: error
          retention-days: 14
