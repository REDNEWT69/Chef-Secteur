<head>

  <meta name="application-name" content="Store Runner">
  <link rel="manifest" href="./manifest.webmanifest?rev=20260925-semaine258">
  <link rel="icon" href="./app-icon.svg?rev=20260925-semaine258" type="image/svg+xml">

    html,body{margin:0;min-height:100%;background:#fbfaf8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  </style>
  <!-- V234 — seule et unique définition visuelle de l'écran de chargement Store Runner.
       Le document runtime écrit par document.write() réutilise ce bloc tel quel : il
       n'existe jamais deux loaders différents, ni deux styles à maintenir en parallèle.
       `data-store-runner-booting` neutralise l'ancien accueil tant que le démarrage dure :
       même si le voile disparaissait trop tôt, l'interface historique ne peut pas s'afficher. -->
  <style id="srBootStyle">
    html[data-store-runner-booting],html[data-store-runner-booting] body{background:#fbfaf8}
    #storeRunnerBoot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:24px;background:#fbfaf8;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;transition:opacity .16s ease}
    #storeRunnerBoot.srBootOut{opacity:0;pointer-events:none}#storeRunnerBoot .srBootInner{max-width:520px}#storeRunnerBoot img{display:block;width:min(220px,62vw);height:auto;margin:0 auto 16px;border-radius:22px;box-shadow:0 16px 42px rgba(25,42,80,.10)}#storeRunnerBoot strong{display:block;font-size:30px;letter-spacing:-.04em}#storeRunnerBoot .srBootSig{display:block;margin-top:5px;font-size:13px;color:#8b8b8b}#storeRunnerBoot .srBootText{display:block;margin-top:9px;color:#77716a;font-size:13px;line-height:1.45}#storeRunnerBoot .err{color:#b43a32;white-space:pre-wrap}
    html[data-store-runner-booting] .homeHero,html[data-store-runner-booting] #homeKpis,html[data-store-runner-booting] #homePriority,html[data-store-runner-booting] #homeNext,html[data-store-runner-booting] #homePanel>.sectionTitle{display:none!important}
  </style>
</head>
<body>
  <div id="storeRunnerBoot" data-store-runner-boot role="status" aria-live="polite"><div class="srBootInner"><img src="./app-icon.svg?rev=20260925-semaine258" alt="S-RUNNER"><strong>Store Runner</strong><span class="srBootSig">S-RUNNER By Red①</span><span id="bootText" class="srBootText" data-boot-text>Chargement de ton espace terrain…</span></div></div>
  <script>
  (async function(){
    const BUILD_REV='20260925-semaine258';
    const withRev=(path)=>path+'?rev='+BUILD_REV;

    /* V234 — un seul écran de chargement, du tout premier octet jusqu'à l'accueil final.
       `document.open()` vide le DOM mais conserve l'objet `window`, donc cette fonction et
       sa closure survivent au document.write() qui installe l'application. Le pilotage du
       loader vit donc ici, dans le shell : rien à télécharger en plus, rien qui puisse
       manquer hors ligne, et un seul propriétaire pour toute l'application. */
    function armBootController(){
      let settled=false,frame=0;

      function bootNode(){return document.getElementById('storeRunnerBoot')}

      /* « Utilisable » = l'accueil final est monté ET la barre de navigation basse a été
         reconstruite. C'est exactement ce que produit home-refresh-v2.js ; tant que ce
         n'est pas vrai, ce qui se trouve sous le voile est encore l'ancienne interface. */
      function appReady(){
        return !!(document.querySelector('#premiumHomeV2 .phTop')&&document.querySelector('#bottomAppNav[data-v2="1"]'));
      }

      function reveal(reason){
        if(settled)return;
        settled=true;
        if(frame)window.cancelAnimationFrame(frame);
        document.removeEventListener('store-runner:home-rendered',onHomeRendered);
        window.removeEventListener('load',onLoad);
        const root=document.documentElement;
        if(root)root.removeAttribute('data-store-runner-booting');
        const node=bootNode();
        if(!node)return;
        node.setAttribute('data-boot-done',reason);
        /* `srBootOut` coupe les pointer-events dès cette ligne : plus aucun clic n'est
           intercepté, y compris pendant le fondu. Le nœud est ensuite retiré du DOM. */
        node.classList.add('srBootOut');
        const drop=function(){if(node.parentNode)node.parentNode.removeChild(node)};
        node.addEventListener('transitionend',drop,{once:true});
        window.setTimeout(drop,400);
      }

      /* Deux frames : la première laisse le navigateur composer l'accueil final, la
         seconde garantit qu'il est réellement peint avant que le voile ne s'efface. */
      function revealAfterPaint(reason){
        window.requestAnimationFrame(function(){window.requestAnimationFrame(function(){reveal(reason)})});
      }

      /* Sondage par frame : le loader ne dépend donc d'AUCUN événement. Que
         `store-runner:home-rendered` soit manqué, émis avant l'écoute ou jamais émis ne
         change rien au résultat. */
      function tick(){
        if(settled)return;
        if(appReady()){revealAfterPaint('home-rendered');return}
        frame=window.requestAnimationFrame(tick);
      }

      function onHomeRendered(){if(!settled&&appReady())revealAfterPaint('home-rendered')}

      /* Filet de sécurité, sans délai arbitraire : à `load`, tous les scripts ont été
         exécutés et tous les gestionnaires DOMContentLoaded ont tourné. Si l'accueil final
         n'est toujours pas monté, il ne le sera pas pour ce démarrage — mieux vaut rendre
         l'application de base utilisable que laisser un voile capturer les clics. */
      function onLoad(){
        window.requestAnimationFrame(function(){window.requestAnimationFrame(function(){
          if(settled)return;
          reveal(appReady()?'home-rendered':'app-loaded');
        })});
      }

      document.addEventListener('store-runner:home-rendered',onHomeRendered);
      window.addEventListener('load',onLoad);
      if(document.readyState==='complete')onLoad();
      tick();
      window.StoreRunnerBoot={isReady:appReady,reveal:function(){reveal('manual')},settled:function(){return settled}};
    }

    function showBootError(e){
      const text=document.querySelector('[data-boot-text]');
      if(text){
        text.className='srBootText err';
        text.textContent='Erreur de chargement : '+(e&&e.message?e.message:String(e));
      }
      console.error(e);
    }

    /* STORAGE-ENGINE:BEGIN
       V256 — moteur de stockage durable. Ce bloc est extrait et exécuté tel quel par
       tests/storage-engine-v256.test.cjs : il ne dépend que de `win`.

       Pourquoi : tout `state` (visites 6P comprises) tenait dans UNE clé localStorage.
       Une visite pèse ~10 Ko ; à 4 visites par jour le secteur dépasse 2,8 Mo en trois
       mois et 5,5 Mo en six, soit le quota localStorage (~5 Mo) — les sauvegardes et le
       journal de récupération cassaient bien avant. IndexedDB offre des centaines de Mo.

       Contrat inchangé pour les 60 modules : `window.__chefStorage` reste une interface
       Storage SYNCHRONE (getItem/setItem/removeItem/key/length), servie depuis une copie
       mémoire chargée au démarrage.
       - Écriture : chaque setItem/removeItem part aussitôt dans une transaction
         IndexedDB. Toutes les écritures d'une même tâche partagent la même transaction :
         une sauvegarde multi-clés (état + archive + range…) est atomique sur disque.
       - Échec (quota, base fermée par iOS en arrière-plan) : la clé reste « à écrire »,
         l'erreur est publiée (`store-runner:storage-status`) et la prochaine écriture ou
         `flush()` la réessaie après réouverture de la base. Rien n'est jamais avalé.
       - Bascule : au premier démarrage V256, les clés localStorage sont COPIÉES dans
         IndexedDB, relues et comparées. localStorage n'est ni vidé ni réécrit : il reste
         la copie d'avant bascule. Sans IndexedDB utilisable, on reste sur localStorage. */
    function createMemoryStorage(){
      const memory=new Map();
      return {
        getItem(key){key=String(key);return memory.has(key)?memory.get(key):null},
        setItem(key,value){memory.set(String(key),String(value))},
        removeItem(key){key=String(key);memory.delete(key)},
        clear(){memory.clear()},
        key(index){return Array.from(memory.keys())[Number(index)]??null},
        get length(){return memory.size}
      };
    }

    async function createStorageEngine(win){
      const DB_NAME='chef-secteur-storage',DB_VERSION=3,STORE='kv';
      /* Présent dans IndexedDB = la base principale a été initialisée par V256+. */
      const MARKER='store-runner-storage-engine-v1';
      /* Présent dans localStorage = la bascule a déjà eu lieu sur cet appareil. */
      const LEGACY_MARKER='store-runner-storage-engine';
      /* Jamais recopiés : sondes techniques et jetons OAuth (le module Agenda les lit
         directement dans localStorage, et un jeton n'a rien à faire dans la base). */
      const NOT_COPIED=/^(__chef_storage_test__|__t|chef_secteur_google_token_v2|chef_google_token_expiry_v1|chef_google_token_persist_v1|chef_google_token_persist_expiry_v1)$/;
      const health={engine:'memory',activatedAt:null,activatedFrom:null,recoveredFromLegacy:null,legacyChanged:false,
        pending:0,failedKeys:[],otherWindow:false,lastError:null,lastErrorName:null,lastErrorAt:null,lastCommitAt:null,openError:null};
      win.__chefStorageHealth=health;
      const now=()=>new Date().toISOString();
      function emit(){
        try{if(typeof win.CustomEvent==='function'&&typeof win.dispatchEvent==='function')win.dispatchEvent(new win.CustomEvent('store-runner:storage-status',{detail:Object.assign({},health,{failedKeys:health.failedKeys.slice()})}))}catch(e){}
      }
      function fingerprint(text){if(text==null)return null;let h=0x811c9dc5;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return text.length+':'+h.toString(16)}

      let ls=null;
      try{const probe='__chef_storage_test__';win.localStorage.setItem(probe,'1');win.localStorage.removeItem(probe);ls=win.localStorage}
      catch(e){try{ls=win.localStorage&&typeof win.localStorage.getItem==='function'?win.localStorage:null;if(ls)ls.getItem('__probe__')}catch(_){ls=null}}
      const writableLs=(()=>{try{const k='__chef_storage_test__';win.localStorage.setItem(k,'1');win.localStorage.removeItem(k);return true}catch(e){return false}})();

      function open(){
        return new Promise((resolve,reject)=>{
          let req;try{req=win.indexedDB.open(DB_NAME,DB_VERSION)}catch(e){reject(e);return}
          req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};
          req.onsuccess=()=>resolve(req.result);
          req.onerror=()=>reject(req.error||new Error('IndexedDB indisponible'));
          req.onblocked=()=>reject(new Error('IndexedDB bloquée par un autre onglet'));
        });
      }
      function readAll(db){
        return new Promise((resolve,reject)=>{
          const out=new Map(),tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).openCursor();
          req.onsuccess=()=>{const c=req.result;if(c){out.set(String(c.key),String(c.value));c.continue()}else resolve(out)};
          req.onerror=()=>reject(req.error||new Error('Lecture IndexedDB impossible'));
        });
      }
      function writeEntries(db,entries){
        return new Promise((resolve,reject)=>{
          const tx=db.transaction(STORE,'readwrite'),os=tx.objectStore(STORE);
          tx.oncomplete=()=>resolve();tx.onabort=tx.onerror=()=>reject(tx.error||new Error('Écriture IndexedDB interrompue'));
          for(const [k,v] of entries){if(v===null)os.delete(k);else os.put(v,k)}
        });
      }

      let db=null,loaded=null;
      if(win.indexedDB){
        try{db=await open();loaded=await readAll(db)}
        catch(e){health.openError=String(e&&e.message||e);try{db&&db.close()}catch(_){}db=null;loaded=null}
      }

      if(db&&loaded){
        try{
          if(!loaded.has(MARKER)){
            /* Première activation — ou base IndexedDB perdue après une bascule : dans ce
               cas la seule copie restante est celle, figée, de localStorage. On la reprend
               et on le dit, plutôt que de démarrer vide. */
            let legacy=null;try{legacy=ls&&JSON.parse(ls.getItem(LEGACY_MARKER)||'null')}catch(e){legacy=null}
            const copy=[];
            if(ls)for(let i=0;i<ls.length;i++){const k=ls.key(i);if(k==null||NOT_COPIED.test(k)||k===LEGACY_MARKER)continue;const v=ls.getItem(k);if(v!==null)copy.push([k,v])}
            const at=now(),from=copy.length?'localStorage':'vide';
            const marker={version:1,activatedAt:at,from,keys:copy.length,legacyMain:ls?fingerprint(ls.getItem('sector_planner_universal_v1')):null,recoveredFromLegacy:legacy&&legacy.at?legacy.at:null};
            await writeEntries(db,copy.concat([[MARKER,JSON.stringify(marker)]]));
            const check=await readAll(db);
            for(const [k,v] of copy)if(check.get(k)!==v)throw new Error('Copie vers IndexedDB non conforme ('+k+')');
            loaded=check;
            if(ls&&!legacy&&writableLs){try{ls.setItem(LEGACY_MARKER,JSON.stringify({engine:'indexedDB',at}))}catch(e){}}
          }
          const marker=JSON.parse(loaded.get(MARKER)||'{}')||{};
          health.activatedAt=marker.activatedAt||null;health.activatedFrom=marker.from||null;health.recoveredFromLegacy=marker.recoveredFromLegacy||null;
          /* Une version antérieure à V256 relancée après la bascule écrit dans
             localStorage : on le signale, sans rien écraser d'un côté comme de l'autre. */
          if(ls&&marker.legacyMain!==undefined){try{health.legacyChanged=fingerprint(ls.getItem('sector_planner_universal_v1'))!==marker.legacyMain}catch(e){}}
        }catch(e){health.openError=String(e&&e.message||e);try{db.close()}catch(_){}db=null;loaded=null}
      }

      if(!db||!loaded){
        if(ls&&writableLs){health.engine='localStorage';win.__chefStorageMode='localStorage';return ls}
        health.engine='memory';win.__chefStorageMode='memory';
        health.lastError='Stockage de l’appareil indisponible : les modifications seront perdues à la fermeture. Exporte tes données.';
        return createMemoryStorage();
      }

      const memory=loaded;
      const failed=new Set(),inflight=new Set();
      let batch=null,connecting=null,announce=()=>{};
      function wire(d){d.onclose=()=>{if(db===d)db=null};d.onversionchange=()=>{try{d.close()}catch(e){}if(db===d)db=null}}
      wire(db);
      function syncFailed(){health.failedKeys=[...failed]}
      let pagehideArmed=false;
      function fail(keys,error){
        for(const k of keys)failed.add(k);syncFailed();
        /* Armé au premier échec seulement : un écouteur posé au démarrage serait effacé
           par le document.open() qui installe l'application. Sur iPhone la PWA peut être
           suspendue sans préavis : on pousse une dernière fois ce qui reste. */
        if(!pagehideArmed){pagehideArmed=true;try{win.addEventListener('pagehide',()=>{if(failed.size)rewrite([])})}catch(e){}}
        health.lastError=String(error&&error.message||error||'Écriture interrompue');health.lastErrorName=error&&error.name||null;health.lastErrorAt=now();
        emit();
      }
      function reconnect(){
        if(connecting)return connecting;
        connecting=open().then(d=>{db=d;wire(d);connecting=null;if(failed.size)rewrite([...failed]);return d})
          .catch(e=>{connecting=null;fail([],e);throw e});
        return connecting;
      }
      function begin(){
        if(batch)return batch;
        if(!db)return null;
        let tx;try{tx=db.transaction(STORE,'readwrite')}catch(e){db=null;return null}
        const keys=new Set(),current={tx,keys};batch=current;health.pending++;
        const done=new Promise(resolve=>{
          let settled=false;
          tx.oncomplete=()=>{if(settled)return;settled=true;health.pending--;health.lastCommitAt=now();announce();
            let changed=false;for(const k of keys)if(failed.delete(k))changed=true;
            if(changed){syncFailed();if(!failed.size){health.lastError=null;health.lastErrorName=null}emit()}
            resolve(true)};
          tx.onabort=tx.onerror=()=>{if(settled)return;settled=true;health.pending--;fail(keys,tx.error||new Error('Écriture IndexedDB interrompue'));resolve(false)};
        });
        inflight.add(done);done.then(()=>inflight.delete(done));
        const release=()=>{if(batch===current){batch=null;try{if(typeof tx.commit==='function')tx.commit()}catch(e){}}};
        if(typeof win.queueMicrotask==='function')win.queueMicrotask(release);else Promise.resolve().then(release);
        return current;
      }
      function put(current,key){
        const os=current.tx.objectStore(STORE);
        if(memory.has(key))os.put(memory.get(key),key);else os.delete(key);
        current.keys.add(key);
      }
      /* Écrit la valeur ACTUELLE en mémoire de ces clés (la mémoire fait foi). Les clés en
         échec voyagent avec l'écriture suivante : elles reprennent dès que le disque
         accepte à nouveau, dans la même transaction. */
      function rewrite(keys){
        const all=new Set(keys);for(const k of failed)all.add(k);
        for(let attempt=0;attempt<2;attempt++){
          const current=begin();
          if(!current)break;
          try{for(const k of all)put(current,k);return true}
          catch(e){if(batch===current)batch=null;if(e&&e.name==='TransactionInactiveError')continue;fail(all,e);return false}
        }
        fail(all,new Error('Base de l’appareil fermée : nouvelle tentative en cours'));
        reconnect().catch(()=>{});
        return false;
      }
      const api={
        engine:'indexedDB',atomic:true,
        getItem(key){key=String(key);return memory.has(key)?memory.get(key):null},
        setItem(key,value){key=String(key);value=String(value);memory.set(key,value);rewrite([key])},
        removeItem(key){key=String(key);memory.delete(key);rewrite([key])},
        clear(){const keys=[...memory.keys()].filter(k=>k!==MARKER);for(const k of keys)memory.delete(k);rewrite(keys)},
        key(index){return Array.from(memory.keys())[Number(index)]??null},
        get length(){return memory.size},
        /* Résout quand tout ce qui a été écrit est sur disque ; rejette sinon. */
        async flush(){
          if(failed.size){if(!db)await reconnect();rewrite([])}
          await Promise.all([...inflight]);
          if(failed.size){const e=new Error('Enregistrement sur l’appareil impossible : '+(health.lastError||'erreur inconnue'));e.name=health.lastErrorName||'StorageWriteError';throw e}
          return true;
        },
        /* Relit le disque et le compare à la mémoire, clé par clé. */
        async verify(keys){
          await api.flush();
          const d=db||await reconnect();
          const disk=await new Promise((resolve,reject)=>{const out=new Map(),tx=d.transaction(STORE,'readonly'),os=tx.objectStore(STORE);let n=0;const list=[...keys];if(!list.length)resolve(out);
            for(const k of list){const r=os.get(k);r.onsuccess=()=>{out.set(k,r.result===undefined?null:String(r.result));if(++n===list.length)resolve(out)};r.onerror=()=>reject(r.error)}});
          const mismatched=[...keys].filter(k=>disk.get(k)!==api.getItem(k));
          return{ok:!mismatched.length,mismatched};
        },
        health(){return Object.assign({},health,{failedKeys:[...failed]})},
        /* Copie figée d'avant bascule, en lecture seule. */
        legacy(){if(!ls)return null;return{getItem(k){try{return ls.getItem(k)}catch(e){return null}}}}
      };
      /* Chaque fenêtre sert sa propre copie mémoire : une seconde fenêtre ouverte sur
         Store Runner ne verrait plus les écritures de la première, et la dernière à
         écrire l'emporterait. Chaque validation est annoncée aux autres fenêtres, qui
         le signalent (`otherWindow`) au lieu d'écraser en silence. */
      const tabId=Math.random().toString(36).slice(2);
      try{if(typeof win.BroadcastChannel==='function'){const channel=new win.BroadcastChannel('store-runner-storage');
        channel.onmessage=e=>{const d=e&&e.data;if(d&&d.from!==tabId&&!health.otherWindow){health.otherWindow=true;emit()}};
        announce=()=>{try{channel.postMessage({from:tabId,at:Date.now()})}catch(e){}}}}catch(e){}
      health.engine='indexedDB';win.__chefStorageMode='indexedDB';
      return api;
    }
    /* STORAGE-ENGINE:END */

    try{
      if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
      window.__chefStorage=await createStorageEngine(window);

      window.__STORE_RUNNER_BUILD_REV=BUILD_REV;
      document.documentElement.dataset.storeRunnerBuild=BUILD_REV;
      if ('serviceWorker' in navigator) {
        const reloadKey='store-runner-sw-reload:'+BUILD_REV;
        navigator.serviceWorker.addEventListener('controllerchange',function(){
          if(window.__storeRunnerUpdateApplying)return;
          try{if(sessionStorage.getItem(reloadKey))return;sessionStorage.setItem(reloadKey,'1')}catch(e){}
          window.location.reload();
        });
        navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(function(reg){return reg.update()}).catch(function(e){console.warn('Mise à jour hors ligne indisponible',e)});
      }
      const r=await fetch(withRev('./src/chef-secteur.html'));
      if(!r.ok) throw new Error('Impossible de charger l’application ('+r.status+').');
      let html=await r.text();
      if(!html || html.length<1000) throw new Error('Le fichier principal est vide ou incomplet.');

      html=html.replace(/Chef Secteur SAMSUNG/g,'Store Runner').replace(/Chef Secteur/g,'Store Runner');

      const beforePatch=html;
      html=html.replace(
        /function usableStorage\(\)\{[\s\S]*?\}\nfunction save\(\)/,
        "function usableStorage(){var s=window.__chefStorage||null;if(!s)return null;try{var k='__t';s.setItem(k,'1');s.removeItem(k);return s}catch(e){return null}}\nfunction save()"
