       n'existe jamais deux loaders différents, ni deux styles à maintenir en parallèle.
       `data-store-runner-booting` neutralise l'ancien accueil tant que le démarrage dure :

  (async function(){
    const BUILD_REV='20260923-mode-runner2451';
    const withRev=(path)=>path+'?rev='+BUILD_REV;

    /* V234 — un seul écran de chargement, du tout premier octet jusqu'à l'accueil final.
       `document.open()` vide le DOM mais conserve l'objet `window`, donc cette fonction et
       sa closure survivent au document.write() qui installe l'application. Le pilotage du
       loader vit donc ici, dans le shell : rien à télécharger en plus, rien qui puisse
       manquer hors ligne, et un seul propriétaire pour toute l'application. */

      let settled=false,frame=0;

      function bootNode(){return document.getElementById('storeRunnerBoot')}

      /* « Utilisable » = l'accueil final est monté ET la barre de navigation basse a été
         reconstruite. C'est exactement ce que produit home-refresh-v2.js ; tant que ce
         n'est pas vrai, ce qui se trouve sous le voile est encore l'ancienne interface. */
      function appReady(){
        return !!(document.querySelector('#premiumHomeV2 .phTop')&&document.querySelector('#bottomAppNav[data-v2="1"]'));
      }

      function reveal(reason){
        if(settled)return;
        settled=true;
        if(frame)window.cancelAnimationFrame(frame);
        document.removeEventListener('store-runner:home-rendered',onHomeRendered);
        window.removeEventListener('load',onLoad);
        const root=document.documentElement;
        if(root)root.removeAttribute('data-store-runner-booting');
        const node=bootNode();
        if(!node)return;
        node.setAttribute('data-boot-done',reason);
        /* `srBootOut` coupe les pointer-events dès cette ligne : plus aucun clic n'est
           intercepté, y compris pendant le fondu. Le nœud est ensuite retiré du DOM. */
        node.classList.add('srBootOut');
        const drop=function(){if(node.parentNode)node.parentNode.removeChild(node)};
        node.addEventListener('transitionend',drop,{once:true});
        window.setTimeout(drop,400);
      }

      /* Deux frames : la première laisse le navigateur composer l'accueil final, la
         seconde garantit qu'il est réellement peint avant que le voile ne s'efface. */
      function revealAfterPaint(reason){
        window.requestAnimationFrame(function(){window.requestAnimationFrame(function(){reveal(reason)})});
      }

      /* Sondage par frame : le loader ne dépend donc d'AUCUN événement. Que
         `store-runner:home-rendered` soit manqué, émis avant l'écoute ou jamais émis ne
         change rien au résultat. */
      function tick(){
        if(settled)return;
        if(appReady()){revealAfterPaint('home-rendered');return}
        frame=window.requestAnimationFrame(tick);
      }

      function onHomeRendered(){if(!settled&&appReady())revealAfterPaint('home-rendered')}

      /* Filet de sécurité, sans délai arbitraire : à `load`, tous les scripts ont été
         exécutés et tous les gestionnaires DOMContentLoaded ont tourné. Si l'accueil final
         n'est toujours pas monté, il ne le sera pas pour ce démarrage — mieux vaut rendre
         l'application de base utilisable que laisser un voile capturer les clics. */
      function onLoad(){
        window.requestAnimationFrame(function(){window.requestAnimationFrame(function(){
          if(settled)return;
          reveal(appReady()?'home-rendered':'app-loaded');
        })});
      }

      document.addEventListener('store-runner:home-rendered',onHomeRendered);
      window.addEventListener('load',onLoad);
      if(document.readyState==='complete')onLoad();
      tick();
      window.StoreRunnerBoot={isReady:appReady,reveal:function(){reveal('manual')},settled:function(){return settled}};

    function createMemoryStorage(){
      const memory=new Map();
      return {
        getItem(key){key=String(key);return memory.has(key)?memory.get(key):null},
        setItem(key,value){memory.set(String(key),String(value))},
        removeItem(key){key=String(key);memory.delete(key)},
        clear(){memory.clear()},
        key(index){return Array.from(memory.keys())[Number(index)]??null},
        get length(){return memory.size}
      };
    }

    async function createStorageFallback(){
      try{
        const nativeStorage=window.localStorage;
        const key='__chef_storage_test__';
        nativeStorage.setItem(key,'1');
        nativeStorage.removeItem(key);
        window.__chefStorageMode='localStorage';
        return nativeStorage;
      }catch(nativeError){
        console.warn('localStorage indisponible, tentative IndexedDB',nativeError);
      }

      if('indexedDB' in window){
        try{
          const db=await new Promise((resolve,reject)=>{
            const req=indexedDB.open('chef-secteur-storage',3);
            req.onupgradeneeded=()=>{
              const d=req.result;
              if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
            };
            req.onsuccess=()=>resolve(req.result);
            req.onerror=()=>reject(req.error||new Error('IndexedDB indisponible'));
          });

          const memory=new Map();
          await new Promise((resolve,reject)=>{
            const tx=db.transaction('kv','readonly');
            const req=tx.objectStore('kv').openCursor();
            req.onsuccess=()=>{
              const cursor=req.result;
              if(cursor){memory.set(String(cursor.key),String(cursor.value));cursor.continue();}
              else resolve();
            };
            req.onerror=()=>reject(req.error||new Error('Lecture IndexedDB impossible'));
          });

          const persist=(action,key,value)=>{
            try{
              const tx=db.transaction('kv','readwrite');
              const store=tx.objectStore('kv');
              if(action==='put') store.put(value,key);
              else if(action==='delete') store.delete(key);
              else if(action==='clear') store.clear();
            }catch(e){console.warn('Écriture IndexedDB impossible',e)}
          };

          window.__chefStorageMode='indexedDB';
          return {
            getItem(key){key=String(key);return memory.has(key)?memory.get(key):null},
            setItem(key,value){key=String(key);value=String(value);memory.set(key,value);persist('put',key,value)},
            removeItem(key){key=String(key);memory.delete(String(key));persist('delete',key)},
            clear(){memory.clear();persist('clear')},
            flush(){const snapshot=new Map(memory);return new Promise((resolve,reject)=>{
              const tx=db.transaction('kv','readwrite'),store=tx.objectStore('kv');
              tx.oncomplete=()=>resolve();tx.onerror=tx.onabort=()=>reject(tx.error||new Error('Écriture IndexedDB interrompue'));
              store.clear();for(const [key,value] of snapshot)store.put(value,key);
            })},
            key(index){return Array.from(memory.keys())[Number(index)]??null},
            get length(){return memory.size}
          };
        }catch(e){console.error('IndexedDB indisponible',e)}
      }

      window.__chefStorageMode='memory';
      return createMemoryStorage();
    }

      if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}

      const runtimeScopeShim='<script>window.ensureTimeSettings=function(){if(!state.settings)state.settings={};if(!state.settings.startTime)state.settings.startTime=\'08:30\';if(!state.settings.endTime)state.settings.endTime=\'18:00\';if(!state.settings.visitMinutes)state.settings.visitMinutes=60;if(!state.settings.saturdayStart)state.settings.saturdayStart=\'08:00\';if(!state.settings.saturdayEnd)state.settings.saturdayEnd=\'12:00\'};window.dayStartTime=function(day){window.ensureTimeSettings();return day===\'Samedi\'?state.settings.saturdayStart:state.settings.startTime};window.hoursLabel=function(minutes){var h=Math.floor(minutes/60),m=Math.round(minutes%60/5)*5;if(m===60){h++;m=0}return h+\' h\'+(m?\' \'+(\'0\'+m).slice(-2):\'\')};window.routeWorkMinutes=function(route){if(!route||!route.length)return 0;var km=havBase(route[0]);for(var i=1;i<route.length;i++)km+=hav(route[i-1],route[i]);km+=hav(route[route.length-1],baseObj());var visits=0;for(var j=0;j<route.length;j++){try{visits+=typeof window.storeVisitDuration===\'function\'?window.storeVisitDuration(route[j],state):Math.max(15,Number((state.settings&&state.settings.visitMinutes)||60))}catch(e){visits+=Math.max(15,Number((state.settings&&state.settings.visitMinutes)||60))}}return km*1.22/55*60+visits};window.weeklyWorkMinutes=function(){window.ensureTimeSettings();var days=(state.settings&&state.settings.days)||(typeof DEFAULT_WORK_DAYS!==\'undefined\'?DEFAULT_WORK_DAYS:(typeof DAYS!==\'undefined\'?DAYS.slice(0,5):[])),total=0;for(var i=0;i<days.length;i++)total+=window.routeWorkMinutes((state.plan&&state.plan[days[i]])||[]);return total}<\/script>';

      /* Le loader runtime n'est pas une deuxième version du loader : c'est le nœud et le

      const bootStyleNode=document.getElementById('srBootStyle');

      ].map(scriptTag).join('');
      const v184RuntimeShim='<script>(function(){\

function patchThreeWeeks(){var api=window.StoreRunnerTerrainPlanningV1;if(!api||typeof api.generateThreeWeekSnail!==\'function\')return false;if(!api.generateThreeWeekSnail.__v184PlanningCapacity){var original=api.generateThreeWeekSnail;var wrapped=async function(){var previous=window.__storeRunnerPlanningGenerationActive;window.__storeRunnerPlanningGenerationActive=true;try{return await original.apply(this,arguments)}finally{window.__storeRunnerPlanningGenerationActive=previous}};wrapped.__v184PlanningCapacity=true;wrapped.__v184Original=original;api.generateThreeWeekSnail=wrapped}var btn=document.getElementById(\'terrainSnailBtn\');if(btn&&!btn.__v184PlanningCapacity){btn.__v184PlanningCapacity=true;btn.onclick=async function(){try{return await api.generateThreeWeekSnail()}catch(e){if(typeof window.showError===\'function\')window.showError(e&&e.message?e.message:String(e));return null}}}return true}\

})();<\/script>';

      const connectionUi=scriptTag('./connection-ui.js');
      /* V234 — document.open() jette le voile déjà peint : si le premier contenu du
         document runtime dépend du réseau, l'écran devient blanc le temps des
         téléchargements. On construit donc le document pour que sa toute première
         peinture soit le voile : style en ligne d'abord, balisage du voile en tête de

      const patchedHtml=html.replace(/<html\b/i,'<html data-store-runner-booting').replace('<head>','<head>'+runtimeBootStyle+runtimeScopeShim+assistantUiShim+styleTag('./glass-theme.css')).replace('<body>','<body>'+runtimeBootMarkup+scriptTag('./store-runner-visit-model.js')+scriptTag('./reliability-core.js')).replace('</body>',calendarOauthShim+v184RuntimeShim+connectionUi+regionUi+scriptTag('./reliability-ui.js')+styleTag('./store-runner-visits.css')+scriptTag('./store-runner-visit-store.js')+scriptTag('./store-runner-visits.js')+scriptTag('./store-runner-opportunities.js')+scriptTag('./note-proofreader-v221.js')+scriptTag('./visit-report-slack.js')+'</body>');
