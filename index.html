<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chef Secteur</title><meta name="theme-color" content="#f5f5f7"><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f5f7;color:#111}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;margin:0 0 10px}.boot p{color:#6e6e73}.err{color:#b42318;white-space:pre-wrap}</style></head><body><div class="boot"><div><h1>Chef Secteur</h1><p id="bootText">Chargement de l’application…</p></div></div><script>(async function(){const parts=["part01.txt","part02.txt","part03a.txt","part03b.txt","part04.txt","part05.txt","part06.txt","part07.txt"];const status=document.getElementById('bootText');try{if(typeof DecompressionStream==='undefined')throw new Error('Navigateur trop ancien pour charger l’application.');const texts=await Promise.all(parts.map(async n=>{const r=await fetch('./apple-v2/'+n+'?v=applev2b',{cache:'no-store'});if(!r.ok)throw new Error('Impossible de charger '+n+' ('+r.status+')');return(await r.text()).trim()}));const binary=atob(texts.join(''));const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){status.className='err';status.textContent='Erreur de chargement : '+(e&&e.message?e.message:String(e));console.error(e)}})();</script></body></html>
