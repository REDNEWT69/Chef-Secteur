<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Store Runner</title>
  <meta name="theme-color" content="#1428A0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Store Runner">
  <meta name="application-name" content="Store Runner">
  <link rel="manifest" href="./manifest.webmanifest?rev=20260911-fieldfix1">
  <link rel="icon" href="./app-icon.svg?rev=20260911-fieldfix1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./app-icon.svg?rev=20260911-fieldfix1">
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot div{max-width:520px}.boot img{display:block;width:min(280px,72vw);height:auto;margin:0 auto 18px;border-radius:24px;box-shadow:0 16px 42px rgba(25,42,80,.10)}.boot h1{font-weight:800;font-size:34px;letter-spacing:-.04em;margin:0 0 6px}.boot .sig{font-size:14px;color:#8b8b8b;margin:0 0 14px}.boot p{color:#77716a;line-height:1.45}.boot .err{color:#b43a32;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="boot"><div><img src="./store-runner-logo.jpg" alt="S-RUNNER"><h1>Store Runner</h1><p class="sig">S-RUNNER By Red①</p><p id="bootText">Chargement de l’application…</p></div></div>
  <script>
  (async function(){
    const BUILD_REV='20260911-fieldfix1';
    const withRev=(path)=>path+'?rev='+BUILD_REV;
    const status=document.getElementById('bootText');

    function createMemoryStorage(){
      const memory=new Map();
      return {
        getItem(key){key=String(key);return memory.has(key)?memory.get(key):null},
        setItem(key,value){memory.set(String(key),String(value))},
        removeItem(key){memory.delete(String(key))},
        clear(){memory.clear()},
        key(index){return Array.from(memory.keys())[Number(index)]??null},
        get length(){return memory.size}
      };
    }

    async function createStorageFallback(){
      try{
        const nativeStorage=window.localStorage;
        const key='__chef_storage_test__';
        nativeStorage.setItem(key,'1');
        nativeStorage.removeItem(key);
        window.__chefStorageMode='localStorage';
        return nativeStorage;
      }catch(nativeError){
        console.warn('localStorage indisponible, tentative IndexedDB',nativeError);
      }

      if('indexedDB' in window){
        try{
          const db=await new Promise((resolve,reject)=>{
            const req=indexedDB.open('chef-secteur-storage',3);
            req.onupgradeneeded=()=>{
              const d=req.result;
              if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
            };
            req.onsuccess=()=>resolve(req.result);
            req.onerror=()=>reject(req.error||new Error('IndexedDB indisponible'));
          });

          const memory=new Map();
          await new Promise((resolve,reject)=>{
            const tx=db.transaction('kv','readonly');
            const req=tx.objectStore('kv').openCursor();
            req.onsuccess=()=>{
              const cursor=req.result;
              if(cursor){memory.set(String(cursor.key),String(cursor.value));cursor.continue();}
              else resolve();
            };
            req.onerror=()=>reject(req.error||new Error('Lecture IndexedDB impossible'));
          });

          const persist=(action,key,value)=>{
            try{
              const tx=db.transaction('kv','readwrite');
              const store=tx.objectStore('kv');
              if(action==='put') store.put(value,key);
              else if(action==='delete') store.delete(key);
              else if(action==='clear') store.clear();
            }catch(e){console.warn('Écriture IndexedDB impossible',e)}
          };

          window.__chefStorageMode='indexedDB';
          return {
            getItem(key){key=String(key);return memory.has(key)?memory.get(key):null},
            setItem(key,value){key=String(key);value=String(value);memory.set(key,value);persist('put',key,value)},
            removeItem(key){key=String(key);memory.delete(key);persist('delete',key)},
            clear(){memory.clear();persist('clear')},
            flush(){const snapshot=new Map(memory);return new Promise((resolve,reject)=>{
              const tx=db.transaction('kv','readwrite'),store=tx.objectStore('kv');
              tx.oncomplete=()=>resolve();tx.onerror=tx.onabort=()=>reject(tx.error||new Error('Écriture IndexedDB interrompue'));
              store.clear();for(const [key,value] of snapshot)store.put(value,key);
            })},
            key(index){return Array.from(memory.keys())[Number(index)]??null},
            get length(){return memory.size}
          };
        }catch(e){console.error('IndexedDB indisponible',e)}
      }

      window.__chefStorageMode='memory';
      return createMemoryStorage();
    }

    try{
      if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
      window.__chefStorage=await createStorageFallback();

      window.__STORE_RUNNER_BUILD_REV=BUILD_REV;
      document.documentElement.dataset.storeRunnerBuild=BUILD_REV;
      if ('serviceWorker' in navigator) {
        const reloadKey='store-runner-sw-reload:'+BUILD_REV;
        navigator.serviceWorker.addEventListener('controllerchange',function(){
          try{if(sessionStorage.getItem(reloadKey))return;sessionStorage.setItem(reloadKey,'1')}catch(e){}
          window.location.reload();
        });
        navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(function(reg){return reg.update()}).catch(function(e){console.warn('Mise à jour hors ligne indisponible',e)});
      }
      status.textContent='Chargement de Store Runner…';
      const r=await fetch(withRev('./src/chef-secteur.html'),{cache:'no-store'});
      if(!r.ok) throw new Error('Impossible de charger l’application ('+r.status+').');
      let html=await r.text();
      if(!html || html.length<1000) throw new Error('Le fichier principal est vide ou incomplet.');

      html=html.replace(/Chef Secteur SAMSUNG/g,'Store Runner').replace(/Chef Secteur/g,'Store Runner');

      const beforePatch=html;
      html=html.replace(
        /function usableStorage\(\)\{[\s\S]*?\}\nfunction save\(\)/,
        "function usableStorage(){var s=window.__chefStorage||null;if(!s)return null;try{var k='__t';s.setItem(k,'1');s.removeItem(k);return s}catch(e){return null}}\nfunction save()"
      );
      if(html===beforePatch) throw new Error('Correctif de stockage non appliqué au fichier principal.');

      const runtimeScopeShim='<script>window.ensureTimeSettings=function(){if(!state.settings)state.settings={};if(!state.settings.startTime)state.settings.startTime=\'08:30\';if(!state.settings.endTime)state.settings.endTime=\'18:00\';if(!state.settings.visitMinutes)state.settings.visitMinutes=60;if(!state.settings.saturdayStart)state.settings.saturdayStart=\'08:00\';if(!state.settings.saturdayEnd)state.settings.saturdayEnd=\'12:00\'};window.dayStartTime=function(day){window.ensureTimeSettings();return day===\'Samedi\'?state.settings.saturdayStart:state.settings.startTime};window.hoursLabel=function(minutes){var h=Math.floor(minutes/60),m=Math.round(minutes%60/5)*5;if(m===60){h++;m=0}return h+\' h\'+(m?\' \'+(\'0\'+m).slice(-2):\'\')};window.routeWorkMinutes=function(route){if(!route||!route.length)return 0;var km=havBase(route[0]);for(var i=1;i<route.length;i++)km+=hav(route[i-1],route[i]);km+=hav(route[route.length-1],baseObj());return km*1.22/55*60+route.length*Number((state.settings&&state.settings.visitMinutes)||60)};window.weeklyWorkMinutes=function(){window.ensureTimeSettings();var days=(state.settings&&state.settings.days)||(typeof DEFAULT_WORK_DAYS!==\'undefined\'?DEFAULT_WORK_DAYS:(typeof DAYS!==\'undefined\'?DAYS.slice(0,5):[])),total=0;for(var i=0;i<days.length;i++)total+=window.routeWorkMinutes((state.plan&&state.plan[days[i]])||[]);return total}<\/script>';
      const assistantUiShim='<style>#assistFab{font-size:0!important;width:54px!important;height:54px!important;border-radius:18px!important;background:linear-gradient(180deg,#111827,#1f2937)!important;box-shadow:0 10px 26px rgba(17,24,39,.28)!important}#assistFab::before{content:"✦";font-size:24px!important;line-height:1;color:#fff;font-weight:700}.assist{z-index:140!important}.ainput{display:flex!important;position:sticky!important;bottom:0!important;z-index:4!important;flex:0 0 auto!important;background:#fff!important;padding:11px 12px calc(11px + env(safe-area-inset-bottom))!important;border-top:1px solid #e5e7eb!important}.ainput input{min-width:0!important;flex:1!important;height:46px!important;color:#1d1d1f!important;background:#fff!important;-webkit-text-fill-color:#1d1d1f!important;caret-color:#0a84ff!important;opacity:1!important}.ainput button{min-width:86px!important;height:46px!important}.achips{flex:0 0 auto!important}.amsgs{min-height:0!important;flex:1 1 auto!important;overflow:auto!important;color:#1d1d1f!important}.amsg.bot{color:#1d1d1f!important}.amsg.user{color:#fff!important}@media(max-width:700px){.assist{z-index:140!important;bottom:0!important;height:min(620px,calc(100dvh - 70px))!important;max-height:calc(100dvh - 70px)!important}.ainput{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style>';
      const scriptTag=(src)=>'<script src="'+withRev(src)+'"><\/script>';
      const styleTag=(href)=>'<link rel="stylesheet" href="'+withRev(href)+'">';
      const calendarOauthShim=[
        './calendar-oauth.js','./planning-generation-controller.js','./calendar-enhancements.js','./ui-polish.js','./route-polish.js','./navigation-controller.js','./profile-controller.js','./store-runner-branding.js','./planning-ui-fixes.js','./ai-gateway-config.js','./assistant-upgrade.js','./assistant-visit-context.js','./ai-context-limit.js','./assistant-store-lookup.js','./map-layer-fix.js','./timeline-end-times.js','./visit-counting.js','./range-planner-v2.js','./working-hours-end.js','./daily-capacity.js','./planning-pro-plus.js','./period-day-slider.js','./workdays-enforcer.js','./visit-history-delete.js','./assistant-sheet-drag.js','./visual-refresh-v1.js','./home-refresh-v2.js','./auto-planning-fix.js'
      ].map(scriptTag).join('');
      const regionUi=styleTag('./region-stores.css')+['./region-fetch-resilience.js','./region-stores.js','./official-catalog.js','./boulanger-national.js','./national-sectors.js','./sector-admin.js','./stores-layout-order.js'].map(scriptTag).join('');
      const connectionUi=scriptTag('./connection-ui.js');
      const patchedHtml=html.replace('<head>','<head>'+scriptTag('./store-runner-visit-model.js')+scriptTag('./reliability-core.js')+runtimeScopeShim+assistantUiShim+styleTag('./glass-theme.css')).replace('</body>',calendarOauthShim+connectionUi+regionUi+scriptTag('./reliability-ui.js')+styleTag('./store-runner-visits.css')+scriptTag('./store-runner-visit-store.js')+scriptTag('./store-runner-visits.js')+'</body>');
      document.open();
      document.write(patchedHtml);
      document.close();
    }catch(e){
      status.className='err';
      status.textContent='Erreur de chargement : '+(e&&e.message?e.message:String(e));
      console.error(e);
    }
  })();
  </script>
</body>
</html>
