<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chef Secteur</title>
  <meta name="theme-color" content="#f4f6fa">
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot div{max-width:520px}.boot h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;margin:0 0 10px}.boot p{color:#77716a;line-height:1.45}.boot .err{color:#b43a32;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="boot"><div><h1>Chef Secteur</h1><p id="bootText">Chargement de l’application…</p></div></div>
  <script>
  (async function(){
    const parts=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt','part07.txt'];
    const status=document.getElementById('bootText');
    try{
      if(typeof DecompressionStream==='undefined') throw new Error('Ce navigateur ne prend pas en charge la décompression nécessaire. Utilise une version récente de Safari, Chrome ou Edge.');
      const texts=await Promise.all(parts.map(async name=>{
        const r=await fetch('./payload/'+name+'?v=apple3',{cache:'no-store'});
        if(!r.ok) throw new Error('Impossible de charger '+name+' ('+r.status+').');
        return (await r.text()).trim();
      }));
      const binary=atob(texts.join(''));
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html=await new Response(stream).text();

      // Corrige la génération du bouton « régénérer le jour » avant que Safari analyse le script.
      html=html.replace(/<button class="secondary" onclick="regenerateDay\([\s\S]*?↻<\/button>/,
        '<button class="secondary js-regen-day" data-day="\'+esc(day)+\'">↻</button>');

      // Branche les boutons après rendu, sans JavaScript injecté dans les attributs HTML.
      html=html.replace('weekEl.innerHTML=h;',
        'weekEl.innerHTML=h;weekEl.querySelectorAll(".js-regen-day").forEach(function(b){b.onclick=function(e){e.stopPropagation();regenerateDay(this.dataset.day)}});');

      document.open();
      document.write(html);
      document.close();
    }catch(e){
      status.className='err';
      status.textContent='Erreur de chargement : '+(e&&e.message?e.message:String(e));
      console.error(e);
    }
  })();
  </script>
</body>
</html>
