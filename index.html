<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chef Secteur SAMSUNG</title>
  <meta name="theme-color" content="#f4f6fa">
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot div{max-width:520px}.boot h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;margin:0 0 10px}.boot p{color:#77716a;line-height:1.45}.boot .err{color:#b43a32;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="boot"><div><h1>Chef Secteur SAMSUNG</h1><p id="bootText">Chargement de l’application…</p></div></div>
  <script>
  (async function(){
    const parts=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt','part07.txt','part08.txt'];
    const status=document.getElementById('bootText');
    try{
      if(typeof DecompressionStream==='undefined') throw new Error('Ce navigateur ne prend pas en charge la décompression nécessaire. Utilise une version récente de Safari, Chrome ou Edge.');
      const texts=await Promise.all(parts.map(async name=>{
        const r=await fetch('./payload/'+name,{cache:'no-store'});
        if(!r.ok) throw new Error('Impossible de charger '+name+' ('+r.status+').');
        return (await r.text()).trim();
      }));
      const binary=atob(texts.join(''));
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      const runtimeScopeShim='<script>window.ensureTimeSettings=function(){if(!state.settings)state.settings={};if(!state.settings.startTime)state.settings.startTime=\'08:30\';if(!state.settings.visitMinutes)state.settings.visitMinutes=60;if(!state.settings.saturdayStart)state.settings.saturdayStart=\'08:00\';if(!state.settings.saturdayEnd)state.settings.saturdayEnd=\'12:00\'};window.dayStartTime=function(day){window.ensureTimeSettings();return day===\'Samedi\'?state.settings.saturdayStart:state.settings.startTime};window.hoursLabel=function(minutes){var h=Math.floor(minutes/60),m=Math.round(minutes%60/5)*5;if(m===60){h++;m=0}return h+\' h\'+(m?\' \'+(\'0\'+m).slice(-2):\'\')};window.routeWorkMinutes=function(route){if(!route||!route.length)return 0;var km=havBase(route[0]);for(var i=1;i<route.length;i++)km+=hav(route[i-1],route[i]);km+=hav(route[route.length-1],baseObj());return km*1.22/55*60+route.length*Number((state.settings&&state.settings.visitMinutes)||60)};window.weeklyWorkMinutes=function(){window.ensureTimeSettings();var days=(state.settings&&state.settings.days)||(typeof DEFAULT_WORK_DAYS!==\'undefined\'?DEFAULT_WORK_DAYS:(typeof DAYS!==\'undefined\'?DAYS.slice(0,5):[])),total=0;for(var i=0;i<days.length;i++)total+=window.routeWorkMinutes((state.plan&&state.plan[days[i]])||[]);return total}<\/script>';
      const assistantUiShim='<style>#assistFab{font-size:0!important;width:54px!important;height:54px!important;border-radius:18px!important;background:linear-gradient(180deg,#111827,#1f2937)!important;box-shadow:0 10px 26px rgba(17,24,39,.28)!important}#assistFab::before{content:"✦";font-size:24px!important;line-height:1;color:#fff;font-weight:700}.assist{z-index:140!important}.ainput{display:flex!important;position:sticky!important;bottom:0!important;z-index:4!important;flex:0 0 auto!important;background:#fff!important;padding:11px 12px calc(11px + env(safe-area-inset-bottom))!important;border-top:1px solid #e5e7eb!important}.ainput input{min-width:0!important;flex:1!important;height:46px!important;color:#1d1d1f!important;background:#fff!important;-webkit-text-fill-color:#1d1d1f!important;caret-color:#0a84ff!important;opacity:1!important}.ainput button{min-width:86px!important;height:46px!important}.achips{flex:0 0 auto!important}.amsgs{min-height:0!important;flex:1 1 auto!important;overflow:auto!important;color:#1d1d1f!important}.amsg.bot{color:#1d1d1f!important}.amsg.user{color:#fff!important}@media(max-width:700px){.assist{z-index:140!important;bottom:0!important;height:min(620px,calc(100dvh - 70px))!important;max-height:calc(100dvh - 70px)!important}.ainput{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style>';
      const patchedHtml=html.replace('<head>','<head>'+runtimeScopeShim+assistantUiShim);
      document.open(); document.write(patchedHtml); document.close();
    }catch(e){
      status.className='err';
      status.textContent='Erreur de chargement : '+(e&&e.message?e.message:String(e));
      console.error(e);
    }
  })();
  </script>
</body>
</html>
