<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Chef Secteur</title>
  <meta name="theme-color" content="#f4f6fa">
  <style>
    html,body{margin:0;min-height:100%;background:#fbfaf8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot div{max-width:520px}.boot h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;margin:0 0 10px}.boot p{color:#77716a;line-height:1.45}.boot .err{color:#b43a32;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="boot"><div><h1>Chef Secteur</h1><p id="bootText">Chargement de la V3 Premium Fusion…</p></div></div>
  <script>
  (async function(){
    const r=await fetch('./Chef_Secteur_V3_Premium_FUSION.html',{cache:'no-store'});
    const status=document.getElementById('bootText');
    try{
      if(!r.ok) throw new Error('Impossible de charger la V3 Premium Fusion ('+r.status+').');
      const html=await r.text();
      document.open(); document.write(html); document.close();
    }catch(e){status.className='err';status.textContent='Erreur de chargement : '+(e&&e.message?e.message:String(e));}
  })();
  </script>
</body>
</html>
