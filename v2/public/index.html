<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Store Runner V2 (test)</title>
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./planning.css">
</head>
<body>
<div id="app"></div>
<script type="module">
  import { createShell } from '../src/app/shell.mjs';
  import { createStore } from '../src/core/store.mjs';
  import { createPlanningFeature } from '../src/planning/planning.mjs';
  import { createPlanningRangeFeature } from '../src/planning/range-ui.mjs';
  import { createStoresFeature } from '../src/stores/stores.mjs';

  const response = await fetch('../fixtures/stores-demo-state.json', { cache: 'no-store' });
  if (!response.ok) throw new Error(`Fixture V2 indisponible (${response.status})`);
  const store = createStore(await response.json());
  const shell = createShell({ root: document.getElementById('app') });

  const planningFeature = createPlanningFeature({ document, store });
  shell.mountScreen('planning', planningFeature.element);

  const planningRangeFeature = createPlanningRangeFeature({ document, store });
  shell.mountScreen('planning', planningRangeFeature.element);

  const storesFeature = createStoresFeature({ document, store });
  shell.mountScreen('stores', storesFeature.element);
</script>
</body>
</html>
